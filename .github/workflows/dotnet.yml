name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Ruvarr.slnx
    - name: Build
      run: dotnet build Ruvarr.slnx --no-restore
    - name: Test
      run: dotnet test Ruvarr.slnx --no-build --verbosity normal
      env:
        Sonarr__BaseAddress: "http://localhost/"
        Sonarr__ApiKey: "placeholder"
        Tmdb__ApiKey: "placeholder"
